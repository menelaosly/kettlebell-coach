<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="20-minute kettlebell workouts with a calendar, WOD clock and workout log.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1e23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KB Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Kettlebell Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky tab bar over one column of views; the clock view is a single big readable panel. Workout types use competition-kettlebell colours. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface2:#e2e6ea; --ink:#14181d; --muted:#5a636d; --line:#cdd3d9;
  --accent:#f2c230; --on-accent:#17140a; --primary:#14181d; --on-primary:#ffffff;
  --emom:#2563c9; --amrap:#cf3434; --rounds:#23874a; --mobility:#c93f80;
  --done:#23874a; --warn:#b4570a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1e23; --surface2:#242a31; --ink:#edf0f3; --muted:#9aa3ad; --line:#2f363e;
  --accent:#f2c230; --on-accent:#17140a; --primary:#edf0f3; --on-primary:#111417;
  --emom:#5d93ee; --amrap:#ee6464; --rounds:#4fc27e; --mobility:#ec79b0; --done:#4fc27e; --warn:#f0a050;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1e23; --surface2:#242a31; --ink:#edf0f3; --muted:#9aa3ad; --line:#2f363e;
  --accent:#f2c230; --on-accent:#17140a; --primary:#edf0f3; --on-primary:#111417;
  --emom:#5d93ee; --amrap:#ee6464; --rounds:#4fc27e; --mobility:#ec79b0; --done:#4fc27e; --warn:#f0a050;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:22px;height:22px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px}
section.view{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
button,.btn{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.1}
button:hover,.btn:hover{border-color:var(--muted)}
button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.small,.btn.small{font-size:13px;padding:6px 10px}
button.danger{color:var(--amrap)}
button:disabled{opacity:.45;cursor:default}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;color:#fff;background:var(--muted);white-space:nowrap}
.t-emom{background:var(--emom)} .t-amrap{background:var(--amrap)} .t-rounds{background:var(--rounds)} .t-mobility{background:var(--mobility)} .t-rest{background:var(--surface2);color:var(--muted)}
.ex{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ex td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.ex td.n{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted);width:34px}
.ex td.r{font-family:var(--f-display);font-weight:700;font-size:20px;width:96px;white-space:nowrap}
.ex td.m{font-weight:500}
.ex td.fig{width:64px;padding:2px 8px 2px 0}
.ex td.fig canvas{display:block;width:56px;height:46px;background:var(--surface2);border-radius:6px}
.hero-w .ex td.fig{width:84px}
.hero-w .ex td.fig canvas{width:76px;height:62px}
.ex td{vertical-align:middle}
#ck-fig{width:min(300px,72vw);height:min(220px,53vw);background:var(--surface2);border-radius:12px;display:block}
.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.strip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px}
.strip canvas{width:104px;height:84px;background:var(--surface2);border-radius:8px;display:block}
.strip figcaption{font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;line-height:1.1;text-align:center}
.hero-w{display:flex;flex-direction:column;gap:14px}
.hero-w h1{font-size:40px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-variant-numeric:tabular-nums;color:var(--ink);font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500}
.wd .dn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.wd .dd{font-family:var(--f-display);font-size:20px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--surface2)}
.wd.today{border-color:var(--ink)}
.wd.isdone .dot,.day.isdone .tick{background:var(--done)}
/* calendar */
.calhead{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:84px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400;align-items:stretch}
.day.out{opacity:.4}
.day.today{border:2px solid var(--ink)}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day .dnum{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:transparent}
.tick svg{width:12px;height:12px;stroke:#fff}
.day .chip{font-size:10px;padding:2px 5px;align-self:flex-start}
.day .wn{font-size:11.5px;color:var(--muted);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:600px){.day{min-height:62px;padding:4px}.day .wn{display:none}.day .chip{font-size:9px;padding:1px 4px}.cal{gap:4px}}
/* workouts */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card .ex td.r{font-size:17px;width:80px}
.card .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
/* clock */
.clock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.phase{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:16px;padding:4px 12px;border-radius:999px;background:var(--surface2)}
.phase.prep{background:var(--accent);color:var(--on-accent)}
.phase.work{background:var(--primary);color:var(--on-primary)}
.phase.end{background:var(--done);color:#fff}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(88px,24vw,200px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big.hot{color:var(--amrap)}
.station{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,44px);text-transform:uppercase;line-height:1}
.station .reps{color:var(--muted);margin-right:10px}
.subline{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--f-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{width:100%;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.rounds{display:flex;align-items:center;gap:14px}
.rounds b{font-family:var(--f-display);font-size:56px;font-weight:800;min-width:70px;font-variant-numeric:tabular-nums;line-height:1}
.rounds button.plus{font-size:28px;padding:14px 26px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctrl button{font-size:20px;padding:12px 22px}
.setup{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.setup label.f{flex:1 1 140px}
.setup label.f.wide{flex:2 1 240px}
.finish{border:2px solid var(--done)}
.loglist{display:flex;flex-direction:column}
.le{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.le:first-child{border-top:0}
.le .ld{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.le .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.le .lt b{font-weight:600}
.le .lt span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.bell{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:baseline;border:1px solid var(--line)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--done)} .sync.local i{background:var(--warn)}
.empty{padding:24px;text-align:center;color:var(--muted)}
a.reel{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
/* responsive menu */
.menu-btn{display:none;margin-left:auto;padding:8px 10px}
.menu-btn svg{width:22px;height:22px}
@media (max-width:720px){
  .menu-btn{display:inline-flex}
  .bar{flex-wrap:nowrap;gap:10px}
  .brand{font-size:19px;min-width:0}
  nav.tabs{display:none;position:absolute;left:0;right:0;top:100%;margin:0;flex-direction:column;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 12px 24px rgba(0,0,0,.12)}
  nav.tabs.open{display:flex}
  nav.tabs a{border-radius:8px;padding:12px 14px;font-size:18px}
}
@media (max-width:420px){.sync span{display:none}}
/* focus mode while a workout runs */
.clock{position:relative}
#ck-exit{position:absolute;top:12px;left:12px}
.focus header.top{display:none}
.focus body::before{background:var(--bg)}
.focus main{padding-block:12px}
.focus #v-clock{gap:12px}
.focus #v-clock .clock{min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));justify-content:center;padding-top:56px}
.focus #v-clock .clock > .note{display:none}
.focus .big{font-size:clamp(100px,28vw,240px)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8 8.5a4 4 0 1 1 8 0"/><path d="M7.5 9h9"/><circle cx="12" cy="15" r="6.2"/></svg>Kettlebell Coach</div>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav class="tabs" id="nav" aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#calendar" data-tab="calendar">Calendar</a>
      <a href="#workouts" data-tab="workouts">Workouts</a>
      <a href="#log" data-tab="log">Log</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-calendar" hidden></section>
  <section class="view" id="v-workouts" hidden></section>
  <section class="view" id="v-clock" hidden>
    <div class="panel" id="ck-setup">
      <div class="setup">
        <label class="f wide">Workout or timer
          <select id="ck-src"></select>
        </label>
        <label class="f" id="ck-min-wrap">Minutes
          <input id="ck-min" type="number" min="1" max="90" value="20">
        </label>
        <label class="f" id="ck-work-wrap" hidden>Work (sec)
          <input id="ck-work" type="number" min="5" max="600" value="40">
        </label>
        <label class="f" id="ck-rest-wrap" hidden>Rest (sec)
          <input id="ck-rest" type="number" min="0" max="600" value="20">
        </label>
        <label class="f" id="ck-rds-wrap" hidden>Rounds
          <input id="ck-rds" type="number" min="1" max="99" value="8">
        </label>
        <label class="f">Get ready
          <select id="ck-prep"><option value="10">10 sec</option><option value="5">5 sec</option><option value="0">None</option></select>
        </label>
        <button id="ck-sound" class="small" type="button" aria-pressed="true">Sound on</button>
      </div>
    </div>
    <div class="clock" id="ck">
      <button type="button" class="small" id="ck-exit" hidden>Exit workout</button>
      <div class="eyebrow" id="ck-title">EMOM</div>
      <div class="phase" id="ck-phase">Ready</div>
      <div class="big" id="ck-big">20:00</div>
      <canvas id="ck-fig" data-move="" role="img" aria-label="Movement demo"></canvas>
      <div class="strip" id="ck-strip" hidden></div>
      <div class="station" id="ck-station"></div>
      <div class="subline" id="ck-sub"></div>
      <div class="progress"><i id="ck-bar"></i></div>
      <div class="rounds" id="ck-rounds" hidden>
        <button type="button" id="ck-minus" class="small" aria-label="Remove a round">−1</button>
        <div><div class="eyebrow">Rounds</div><b id="ck-rcount">0</b></div>
        <button type="button" id="ck-plus" class="go plus">+1 Round</button>
      </div>
      <div class="ctrl">
        <button type="button" id="ck-start" class="go">Start</button>
        <button type="button" id="ck-reset">Reset</button>
        <button type="button" id="ck-end">Finish</button>
      </div>
      <div class="note">Beeps on the last 3 seconds of every minute or interval, a long tone when the next one starts, and a mid-point tone to switch sides on R/L holds. Space bar starts and pauses.</div>
    </div>
    <div class="panel finish" id="ck-finish" hidden>
      <div class="row" style="justify-content:space-between"><h2>Workout done</h2><span class="muted" id="ck-fin-date"></span></div>
      <div class="setup" style="margin-top:12px">
        <label class="f wide">Result
          <input id="ck-fin-result" type="text">
        </label>
        <label class="f">Kettlebell
          <select id="ck-fin-bell"></select>
        </label>
        <label class="f wide">Note
          <input id="ck-fin-note" type="text" placeholder="How did it feel?">
        </label>
      </div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="primary" id="ck-fin-save">Save to log</button>
        <button type="button" id="ck-fin-skip">Don't log</button>
      </div>
    </div>
  </section>
  <section class="view" id="v-log" hidden></section>
</main>

<script>
/* ---------- Workout library (from @betterfrmhere reels) ---------- */
const W = [
 {id:"d088",day:88,name:"Deadlift + Crush Press",type:"emom",min:20,reel:"Df2yzKFM2Ut",
  ex:[["12","Deadlift"],["12","Crush press"],["20","Around the world (10 R/L)"],["20","Ballistic row"],["20","Seated leg raises"]]},
 {id:"d087",day:87,name:"Swing + Thruster",type:"emom",min:20,reel:"Df0OAOWsOoW",
  ex:[["15","Kettlebell swing"],["15","Kettlebell thruster"],["20","Side bend (10 R/L)"],["20","Kettlebell row (10 R/L)"],["30 sec","Plank"]]},
 {id:"d086",day:86,name:"Travel Workout",type:"emom",min:20,reel:"DfwBGNfICcl",note:"Posted as 4 rounds of 5 movements: 20 minutes on the EMOM clock.",
  ex:[["12","Kettlebell row"],["12","Upright row"],["12","Kettlebell press"],["24","Around the world (12 R/L)"],["12","Goblet squat"]]},
 {id:"d085",day:85,name:"Easy Pull + Squat",type:"emom",min:20,reel:"DfsaMWKRMx8",note:"Labelled an easy day.",
  ex:[["12","Ballistic row"],["12","Upright row"],["12","Kettlebell curl"],["12","Sumo squat"],["12","Kettlebell halo"]]},
 {id:"d084",day:84,name:"Threes Challenge",type:"amrap",min:20,reel:"Dfp5rcsR0tq",note:"15 reps per round. Benchmark: 23 rounds, then 25 rounds (375 reps).",
  ex:[["3","Kettlebell swing"],["3","Kettlebell press"],["3","Goblet squat"],["3","Bent over row"],["3","Kettlebell push-up"]]},

const logOn = k => S.log.filter(e=>e.date===k);
const doneOn = k => S.log.some(e=>e.date===k);
function streaks(){
  const days = new Set(S.log.map(e=>e.date));
  let cur=0, k=todayKey(); if (!days.has(k)) k=addDays(k,-1);
  while (days.has(k)) { cur++; k=addDays(k,-1); }
  const sorted=[...days].sort(); let best=0, run=0, prev=null;
  for (const d of sorted){ run = (prev && diffDays(prev,d)===1) ? run+1 : 1; best=Math.max(best,run); prev=d; }
  return {cur,best};
}

  return `${w.rounds} rounds · timed holds`;
}

function addLog(k, wid, result, extra={}){

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-start],[data-done],[data-undo],[data-goday],[data-day],[data-cal],[data-filter],[data-today],[data-del],[data-clear],[data-free]");
  if (!t) return;
  const d = t.dataset;
  if (d.start) { loadWorkout(d.start); go("clock"); }
  else if (d.free) { $("ck-src").value = "free-emom"; newClock(); go("clock"); }
  else if (d.done) { const p = planFor(d.done); addLog(d.done, BY[p]?p:null, "Done", BY[p]?{}:{title:"Active rest"}); }
  else if (d.undo) { S.log = S.log.filter(x=>x.date!==d.undo); persist(); renderAll(); }
  else if (d.goday) { calSel=d.goday; const dt=fromKey(d.goday); calMonth={y:dt.getFullYear(),m:dt.getMonth()}; renderCalendar(); hydrateFigs(); go("calendar"); }
  else if (d.day) { calSel=d.day; renderCalendar(); hydrateFigs(); }
  else if (d.cal) { if (d.cal==="0"){const n=new Date(); calMonth={y:n.getFullYear(),m:n.getMonth()}; calSel=todayKey();} else { let m=calMonth.m+Number(d.cal), y=calMonth.y; if(m<0){m=11;y--} if(m>11){m=0;y++} calMonth={y,m}; } renderCalendar(); hydrateFigs(); }

  else if (d.today) { S.overrides[todayKey()]=d.today; persist(); renderAll(); go("today"); }
  else if (d.clear) { delete S.overrides[d.clear]; persist(); renderAll(); }
  else if (d.del) {
    if (pendingDel.has(d.del)) { pendingDel.delete(d.del); S.log=S.log.filter(x=>x.id!==d.del); persist(); renderAll(); }
    else { pendingDel.add(d.del); renderLog(); setTimeout(()=>{ if(pendingDel.delete(d.del)) renderLog(); },4000); }
  }
});
document.addEventListener("change", e=>{

/* ---------- Sound ---------- */
let AC = null;
function audio(){ try { if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); } catch(e) {} }
function beep(freq, dur, vol=.35, delay=0){
  if (!S.sound || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol*.5,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
const SND = { tick:()=>beep(880,.16), go:()=>beep(1320,.6), side:()=>{beep(1100,.12);beep(1100,.12,.35,.18);}, min:()=>beep(660,.1,.25), end:()=>{beep(1320,.25);beep(1320,.25,.35,.32);beep(1760,.7,.35,.64);} };
function syncSoundBtn(){ const b=document.getElementById("ck-sound"); b.textContent=S.sound?"Sound on":"Sound off"; b.setAttribute("aria-pressed", String(S.sound)); const s=document.getElementById("sound-set"); if(s) s.value=S.sound?"1":"0"; }
document.getElementById("ck-sound").addEventListener("click", ()=>{ S.sound=!S.sound; audio(); if(S.sound) SND.tick(); persist(); syncSoundBtn(); });

/* ---------- WOD clock ---------- */
const $ = id => document.getElementById(id);
let C = null, loop = null, wake = null;
function buildConfig(src){
  const min = Math.max(1, Math.min(90, Number($("ck-min").value)||20));
  const prep = Number($("ck-prep").value);
  if (src.startsWith("free-")) {
    const mode = src.slice(5);
    if (mode==="emom") return {title:`Free EMOM · ${min} min`, kind:"down", prep, segs:Array.from({length:min},(_,i)=>({label:"Minute "+(i+1), sec:60})), showMin:true};
    if (mode==="amrap") return {title:`Free AMRAP · ${min} min`, kind:"down", prep, segs:[{label:"As many rounds as possible", sec:min*60}], counter:true};
    if (mode==="fortime") return {title:`For time · ${min} min cap`, kind:"up", prep, cap:min*60, counter:true};
    const work=Math.max(5,Number($("ck-work").value)||40), rest=Math.max(0,Number($("ck-rest").value)||0), rds=Math.max(1,Number($("ck-rds").value)||8);
    const segs=[]; for(let r=1;r<=rds;r++){ segs.push({label:"Work", sec:work, round:r, rounds:rds}); if(rest&&r<rds) segs.push({label:"Rest", sec:rest, rest:true, round:r, rounds:rds}); }
    return {title:`Intervals · ${work}s on / ${rest}s off × ${rds}`, kind:"down", prep, segs};
  }
  const w = BY[src];
  if (w.type==="emom") {
    const n=w.ex.length;
    return {wid:w.id, title:`${w.name} · ${min} min EMOM`, kind:"down", prep, showMin:true,
      segs:Array.from({length:min},(_,i)=>({label:w.ex[i%n][1], reps:w.ex[i%n][0], sec:60, round:Math.floor(i/n)+1, rounds:Math.ceil(min/n), next:w.ex[(i+1)%n]}))};
  }
  if (w.type==="amrap") return {wid:w.id, title:`${w.name} · ${min} min AMRAP`, kind:"down", prep, counter:true, segs:[{label:"AMRAP", sec:min*60}], list:w.ex};
  if (w.type==="rounds") return {wid:w.id, title:`${w.name} · ${w.rounds} rounds for time`, kind:"up", prep, cap:min*60, counter:true, target:w.rounds, list:w.ex};
  const segs=[]; for(let r=1;r<=w.rounds;r++) w.ex.forEach((e,i)=>segs.push({label:e[1], reps:e[0], sec:e[2], side:!!e[3], round:r, rounds:w.rounds, next:i<w.ex.length-1?w.ex[i+1]:(r<w.rounds?w.ex[0]:null)}));
  return {wid:w.id, title:`${w.name} · ${w.rounds} rounds`, kind:"down", prep, segs};
}
function newClock(){
  stopLoop(); releaseWake();
  const src = $("ck-src").value, w = BY[src];
  const mode = w ? w.type : src.slice(5);
  $("ck-min-wrap").hidden = mode==="mobility" || mode==="intervals";
  ["ck-work-wrap","ck-rest-wrap","ck-rds-wrap"].forEach(id=>$(id).hidden = mode!=="intervals");
  const cfg = buildConfig(src);
  cfg.total = cfg.kind==="down" ? cfg.segs.reduce((a,s)=>a+s.sec,0) : cfg.cap;
  C = Object.assign(cfg, {running:false, done:false, base:-cfg.prep, startedAt:0, fired:new Set(), rounds:0});
  $("ck-finish").hidden = true;
  $("ck-rounds").hidden = !C.counter;
  const strip = $("ck-strip");
  strip.innerHTML = C.list ? C.list.map((x,i)=>`<figure>${figCanvas(x[1], i)}<figcaption>${esc(x[0])} ${esc(x[1])}</figcaption></figure>`).join("") : "";
  strip.hidden = !C.list;
  draw(); hydrateFigs();
}
function loadWorkout(id){
  const w = BY[id];
  $("ck-src").value = id;
  if (w && w.min) $("ck-min").value = w.min;
  newClock();
}
const elapsed = () => C.base + (C.running ? (performance.now()-C.startedAt)/1000 : 0);
const fire = (key, fn) => { if (!C.fired.has(key)) { C.fired.add(key); fn(); } };
function segAt(e){ let acc=0; for (let i=0;i<C.segs.length;i++){ if (e < acc+C.segs[i].sec) return {i, seg:C.segs[i], start:acc}; acc+=C.segs[i].sec; } return null; }
function step(){
  if (!C || !C.running) return;
  const e = elapsed();
  if (e < 0) { const s=Math.ceil(-e); if (s<=3) fire("p"+s, SND.tick); return draw(); }
  if (C.prep) fire("go", SND.go); else fire("go", ()=>{});
  if (C.kind==="down") {
    if (e >= C.total) return finish();
    const {i, seg, start} = segAt(e), s = Math.ceil(start+seg.sec-e);
    if (i>0) fire("seg"+i, SND.go);
    if (s<=3) fire("s"+i+"-"+s, SND.tick);
    if (seg.side && e-start >= seg.sec/2) fire("side"+i, SND.side);
  } else {
    if (C.cap && e >= C.cap) return finish();
    const s = Math.ceil(C.cap-e); if (s<=3) fire("c"+s, SND.tick);
    const m = Math.floor(e/60); if (m>0) fire("m"+m, SND.min);
  }
  draw();
}
function draw(){
  if (!C) return;
  updateFocus();
  const e = elapsed();
  $("ck-title").textContent = C.title;
  const ph = $("ck-phase"), big = $("ck-big"), st = $("ck-station"), sb = $("ck-sub");
  $("ck-rcount").textContent = C.rounds;
  $("ck-start").textContent = C.running ? "Pause" : (C.done ? "Again" : (e>-C.prep || (C.prep===0 && e>0) ? "Resume" : "Start"));
  big.classList.remove("hot");
  if (C.done) {
    ph.className="phase end"; ph.textContent="Done";
    big.textContent = C.kind==="up" ? mmss(C.finalE) : mmss(0);
    st.textContent = C.counter ? `${C.rounds} round${C.rounds===1?"":"s"}` : "Workout complete";
    sb.innerHTML = ""; $("ck-bar").style.width="100%"; setClockFig(null); return;
  }
  if (e < 0) {
    ph.className="phase prep"; ph.textContent="Get ready";
    big.textContent = String(Math.ceil(-e)); if (Math.ceil(-e)<=3) big.classList.add("hot");
    const first = C.kind==="down" ? C.segs[0] : null;
    st.innerHTML = first && first.reps ? `<span class="reps">${esc(first.reps)}</span>${esc(first.label)}` : (C.list ? "First: "+esc(C.list[0][0]+" "+C.list[0][1]) : "");
    sb.innerHTML = `<span>Total ${mmss(C.total)}</span>`;
    setClockFig(first && !C.list ? moveFor(first.label) : null);
    $("ck-bar").style.width = "0%"; return;
  }
  ph.className = "phase " + (C.running ? "work" : "");
  if (C.kind==="down") {
    const at = segAt(Math.min(e, C.total-0.001)) || {i:0, seg:C.segs[0], start:0};
    const seg = at.seg, rem = at.start+seg.sec-e;
    ph.textContent = C.running ? (seg.rest ? "Rest" : "Work") : "Paused";
    setClockFig(C.segs.length===1 ? null : moveFor(seg.label));
    if (C.segs.length===1) {
      big.textContent = mmss(Math.ceil(rem)); if (rem<=10) big.classList.add("hot");
      st.innerHTML = C.list ? "Repeat the 5 moves below" : esc(seg.label);
      st.style.fontSize = C.list ? "clamp(18px,3.4vw,26px)" : "";
      sb.innerHTML = `<span>Elapsed ${mmss(e)}</span>`;
    } else {
      st.style.fontSize = "";
      big.textContent = mmss(Math.ceil(rem)); if (rem<=3.05) big.classList.add("hot");
      st.innerHTML = seg.reps ? `<span class="reps">${esc(seg.reps)}</span>${esc(seg.label)}` : esc(seg.label);
      const parts = [];
      if (C.showMin) parts.push(`Minute ${at.i+1} / ${C.segs.length}`);
      if (seg.rounds) parts.push(`Round ${seg.round} / ${seg.rounds}`);
      parts.push(`Left ${mmss(C.total-e)}`);
      if (seg.next) parts.push(`Next: ${esc(seg.next[0])} ${esc(seg.next[1])}`);
      sb.innerHTML = parts.map(p=>`<span>${p}</span>`).join("");
    }
  } else {
    ph.textContent = C.running ? "For time" : "Paused"; setClockFig(null);
    big.textContent = mmss(Math.floor(e)); if (C.cap-e<=10) big.classList.add("hot");
    st.style.fontSize = "clamp(18px,3.4vw,26px)";
    st.innerHTML = C.list ? "Repeat the 5 moves below" : "Count your rounds";
    sb.innerHTML = `${C.target?`<span>Target ${C.target} rounds</span>`:""}<span>Cap ${mmss(C.cap)}</span>`;
  }
  $("ck-bar").style.width = Math.max(0,Math.min(100, e/C.total*100)) + "%";
}
function startLoop(){ stopLoop(); loop = setInterval(step, 100); }
function stopLoop(){ if (loop) clearInterval(loop); loop = null; }
async function requestWake(){ try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch(e) { wake=null; } }
function releaseWake(){ try { wake && wake.release(); } catch(e) {} wake = null; }
function toggle(){
  if (!C) return; audio();
  if (C.done) { newClock(); }
  if (C.running) { C.base = elapsed(); C.running=false; stopLoop(); releaseWake(); draw(); }
  else { C.running=true; C.startedAt=performance.now(); if (C.prep===0) fire("go", SND.go); startLoop(); requestWake(); draw(); }
}
function finish(){
  if (!C || C.done) return;
  const e = elapsed();
  C.finalE = Math.max(0, Math.min(e, C.total)); C.running=false; C.done=true; stopLoop(); releaseWake(); SND.end(); draw();
  let result;
  if (C.counter && C.kind==="down") result = `${C.rounds} rounds`;
  else if (C.kind==="up") result = `${mmss(C.finalE)}${C.rounds?` · ${C.rounds} rounds`:""}`;
  else result = C.finalE >= C.total-1 ? `Completed ${mmss(C.total)}` : `Stopped at ${mmss(C.finalE)}`;
  $("ck-fin-result").value = result; $("ck-fin-note").value = ""; $("ck-fin-bell").value = String(S.bell);
  $("ck-fin-date").textContent = fmtLong(todayKey());
  $("ck-finish").hidden = false; $("ck-finish").scrollIntoView({behavior:"smooth", block:"nearest"});
}
$("ck-start").addEventListener("click", toggle);
$("ck-reset").addEventListener("click", newClock);
$("ck-end").addEventListener("click", ()=>{ if (C && elapsed()>0) finish(); });
let exitArm = null;
$("ck-exit").addEventListener("click", ()=>{
  const btn = $("ck-exit");
  if (exitArm) { clearTimeout(exitArm); exitArm = null; btn.textContent = "Exit workout"; newClock(); go("today"); }
  else { btn.textContent = "Tap again to exit"; exitArm = setTimeout(()=>{ exitArm = null; btn.textContent = "Exit workout"; }, 3000); }
});
$("ck-plus").addEventListener("click", ()=>{ if(!C) return; C.rounds++; if (C.running) SND.min(); if (C.target && C.kind==="up" && C.rounds>=C.target) finish(); draw(); });
$("ck-minus").addEventListener("click", ()=>{ if(!C) return; C.rounds=Math.max(0,C.rounds-1); draw(); });
["ck-src","ck-min","ck-prep","ck-work","ck-rest","ck-rds"].forEach(id=>$(id).addEventListener("change", ()=>{ if (!C || !C.running) newClock(); }));
$("ck-fin-save").addEventListener("click", ()=>{
  const bell = Number($("ck-fin-bell").value);
  S.log.push({id:uid(), date:todayKey(), w:C.wid||null, title:C.wid?undefined:C.title, result:$("ck-fin-result").value.trim()||"Done", bell, note:$("ck-fin-note").value.trim(), ts:Date.now()});
  S.bell = bell; persist(); renderAll(); $("ck-finish").hidden = true; go("log");
});
$("ck-fin-skip").addEventListener("click", ()=>{ $("ck-finish").hidden = true; });
document.addEventListener("keydown", e=>{
  if (e.code!=="Space" || $("v-clock").hidden) return;
  if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
  e.preventDefault(); toggle();
});
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && C && C.running) requestWake(); });
function fillBells(){ const s=$("ck-fin-bell"); s.innerHTML = BELLS.map(b=>`<option value="${b}">${b} kg</option>`).join(""); s.value=String(S.bell); }

/* ---------- Backup ---------- */
document.addEventListener("click", e=>{
  if (e.target.id==="bk-export") {
    const blob = new Blob([JSON.stringify({app:"kettlebell-coach", version:1, exported:new Date().toISOString(), data:S}, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "kettlebell-coach-backup-"+todayKey()+".json";
    document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    document.getElementById("bk-msg").textContent = "Backup saved to your downloads.";
  }
  if (e.target.id==="bk-import") document.getElementById("bk-file").click();
});
document.addEventListener("change", async e=>{
  if (e.target.id!=="bk-file" || !e.target.files[0]) return;
  const msg = ()=>document.getElementById("bk-msg");
  try {
    const j = JSON.parse(await e.target.files[0].text()), d = j.data || j;
    if (!Array.isArray(d.log)) throw new Error("no log");
    const ids = new Set(S.log.map(x=>x.id)), added = d.log.filter(x=>x && x.id && x.date && !ids.has(x.id));
    S.log = S.log.concat(added);
    S.overrides = Object.assign({}, d.overrides||{}, S.overrides);
    if (d.planStart && !S.log.length) S.planStart = d.planStart;
    persist(); renderAll();
    msg().textContent = `Imported ${added.length} workout${added.length===1?"":"s"}.`;
  } catch(err) { msg().textContent = "That file isn't a Kettlebell Coach backup."; }
  e.target.value = "";
});
if ("serviceWorker" in navigator && location.protocol !== "file:") addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- Boot ---------- */
$("ck-src").innerHTML =
  `<optgroup label="Workouts">${W.map(w=>`<option value="${w.id}">Day ${String(w.day).padStart(3,"0")} · ${esc(w.name)} (${TYPE[w.type]})</option>`).join("")}</optgroup>
   <optgroup label="Free timer"><option value="free-emom">EMOM</option><option value="free-amrap">AMRAP countdown</option><option value="free-fortime">For time (count up)</option><option value="free-intervals">Intervals (work / rest)</option></optgroup>`;
renderAll(); syncSoundBtn();
loadWorkout(planFor(todayKey()) && BY[planFor(todayKey())] ? planFor(todayKey()) : "d081");
show(location.hash.slice(1) || "today");
</script>
